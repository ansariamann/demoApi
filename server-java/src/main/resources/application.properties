server.port=3001
# Bind only to loopback — prevents exposure to other machines on the network.
# Remove this line (or set to 0.0.0.0) only if you deliberately want network access.
server.address=127.0.0.1

spring.datasource.url=jdbc:sqlite:./api_explorer.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Never print stack traces or internal details in error responses.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
